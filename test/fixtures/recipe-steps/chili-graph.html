<script type="application/ld+json" class="yoast-schema-graph">{"@context":"https://schema.org","@graph":[{"@type":"WebPage","@id":"https://www.budgetbytes.example/one-pot-chili-pasta/","name":"One Pot Chili Pasta"},{"@type":"ImageObject","@id":"https://www.budgetbytes.example/one-pot-chili-pasta/#primaryimage","url":"https://www.budgetbytes.example/wp-content/uploads/one-pot-chili-pasta-pot.jpg"},{"@type":["Recipe"],"name":"One Pot Chili Pasta","image":["https://www.budgetbytes.example/wp-content/uploads/one-pot-chili-pasta-pot.jpg"],"recipeYield":["6","6 servings"],"totalTime":"PT35M","recipeIngredient":["1 Tbsp olive oil","1 yellow onion","2 cloves garlic","1 lb. ground beef","2 Tbsp chili powder","1 tsp ground cumin","1 (15 oz.) can black beans","1 (15 oz.) can diced tomatoes","2 cups beef broth","8 oz. pasta","1 cup shredded cheddar"],"recipeInstructions":[{"@type":"HowToStep","text":"<p>Dice the onion and mince the garlic. Add the olive oil, onion, and garlic to a large deep skillet or Dutch oven and saut&eacute; over medium heat until the onions are soft and transparent (about 5 minutes).</p>"},{"@type":"HowToStep","text":"Add the ground beef and continue to saut&eacute; until the beef is fully browned."},{"@type":"HowToStep","text":"Add the chili powder, cumin, oregano, garlic powder, cayenne pepper, &amp; smoked paprika. Stir and saut&eacute; for one minute more.&nbsp;"},{"@type":"HowToStep","text":"Drain the black beans and add them to the skillet along with the diced tomatoes, pasta, and beef broth. Stir until everything is evenly combined."},{"@type":"HowToStep","text":"Place a lid on the skillet, turn the heat up to medium-high, and let it come up to a boil. Once boiling, reduce the heat to low and let simmer for 10&ndash;12 minutes, stirring occasionally, until the pasta is tender."},{"@type":"HowToStep","text":"Top with 1 cup shredded cheddar and sliced green onions. Serve."},{"@type":"HowToStep","text":"Pin this recipe for later!"}]}]}</script>
