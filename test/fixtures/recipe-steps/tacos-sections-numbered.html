<html><head><title>Chicken Tinga Tacos</title>
<script type="application/ld+json">{"@context":"https://schema.org/","@type":"Recipe","name":"Chicken Tinga Tacos","image":["//www.isabeleats.example/wp-content/uploads/chicken-tinga.jpg"],"recipeYield":"6","recipeIngredient":["1 tablespoon oil","1 onion, sliced","2 cloves garlic","1 (14 oz) can fire-roasted tomatoes","2 chipotle peppers in adobo","1 ½ pounds chicken breast","12 corn tortillas"],"recipeInstructions":[{"@type":"HowToSection","name":"For the chicken:","itemListElement":[{"@type":"HowToStep","text":"1. Place the chicken in a pot, cover with water and simmer for 20 minutes. Shred with two forks."}]},{"@type":"HowToSection","name":"For the sauce","itemListElement":[{"@type":"HowToStep","text":"For the sauce:"},{"@type":"HowToStep","text":"2. Heat the oil in a large skillet over medium heat. Add 1 onion, sliced, and cook 5 minutes until soft."},{"@type":"HowToStep","text":"3. Blend the tomatoes, chipotle peppers and garlic until smooth. Pour into the skillet and simmer 5 minutes."}]},{"@type":"HowToSection","name":"To serve","itemListElement":[{"@type":"HowToStep","text":"4. Stir in the shredded chicken. Serve in warm tortillas."}]}]}</script>
