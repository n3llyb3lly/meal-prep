<html><head><title>Baked Ziti Recipe</title>
<script type="application/ld+json">[{"@context":"http://schema.org","@type":["Recipe","NewsArticle"],"headline":"Baked Ziti","name":"Baked Ziti","image":{"@type":"ImageObject","url":"https://www.allrecipes.example/thmb/baked-ziti.jpg","height":1125,"width":1500},"recipeYield":"8","totalTime":"PT1H","recipeIngredient":["1 pound dry ziti pasta","1 onion, chopped","1 pound lean ground beef","2 (26 ounce) jars spaghetti sauce","6 ounces provolone cheese, sliced","1 ½ cups sour cream","6 ounces mozzarella cheese, shredded","2 tablespoons grated Parmesan cheese"],"recipeInstructions":[{"@type":"HowToStep","text":"Bring a large pot of lightly salted water to a boil. Add ziti pasta, and cook until al dente, about 8 minutes; drain.\n"},{"@type":"HowToStep","text":"Meanwhile, brown onion and ground beef in a large skillet over medium heat. Add spaghetti sauce, and simmer 15 minutes.\n"},{"@type":"HowToStep","text":"Preheat the oven to 350 degrees F (175 degrees C). Butter a 9x13-inch baking dish.\n"},{"@type":"HowToStep","text":"Layer as follows: &frac12; of the ziti, provolone cheese, sour cream, &frac12; sauce mixture, remaining ziti, mozzarella cheese, and remaining sauce mixture. Top with grated Parmesan cheese.\n"},{"@type":"HowToStep","text":"Bake in the preheated oven until cheeses are melted, about 30 minutes.\n"}]}]</script>
