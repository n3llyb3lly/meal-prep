<body><h1>Grandma's Vegetable Soup</h1>
<h2>Ingredients</h2><ul><li>2 cups chicken broth</li><li>1 onion, diced</li><li>2 carrots, sliced</li></ul>
<h2>Directions</h2><ol><li>Saut&eacute; the onion and carrots in a little oil.</li><li>Add the broth and simmer for 20 minutes.</li></ol>
